[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filepass"
version = "1.0.5"
authors = [
    { name="Orlund Norstrom", email="onorstrom@kamloops.ca" },
    { name="Marco Lussetti", email="mlussetti@kamloops.ca" },
    { name="Parul Parul", email="pparul@kamloops.ca" },
]
dependencies = [
    "bcrypt==4.1.2",
    "cffi==1.16.0",
    "cryptography==42.0.2",
    "graypy==2.1.0",
    "paramiko==3.4.0",
    "pycparser==2.21",
    "PyNaCl==1.5.0",
    "pyspnego==0.12.1",
    "smbprotocol==1.16.1",
]
description = "File synchronization between systems over SMB, SFTP, and local paths."
readme = "README.md"
license = { text= "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
"Homepage" = "https://github.com/cityofkamloops/filepass"
"Bug Tracker" = "https://github.com/cityofkamloops/filepass/issues"
